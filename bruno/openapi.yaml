openapi: 3.0.3
info:
  title: OpenCart API
  description: |
    OpenCart 4.x catalog, account and admin endpoints.

    > ⚠️ **URL structure note:** OpenCart routes everything through a single entry point.
    > All catalog requests hit `http://opencart.local:8080/index.php?route=<route>`
    > All admin requests hit `http://opencart.local:8080/admin/index.php?route=<route>`
    > The paths below are logical names — each operation overrides the server URL to the correct base.

    ---

    ### Catalog auth flow
    1. `GET /index.php?route=account/login` → extract `login_token` from form action in HTML
    2. `POST /index.php?route=account/login.login&login_token={token}` → JSON response contains `redirect` URL with `customer_token`
    3. Pass `customer_token` as query param on every protected account request

    ### Admin auth flow
    1. `GET /admin/` → extract `login_token` from form action in HTML
    2. `POST /admin/index.php?route=common/login.login&login_token={token}` → JSON response contains `redirect` URL with `user_token`
    3. Pass `user_token` as query param on every admin request

    Both tokens are **session-scoped** — a valid PHP session cookie must accompany every request (handled automatically by Bruno's cookie jar).
  version: 4.1.0.4

servers:
  - url: http://opencart.local:8080
    description: Local Docker environment

tags:
  - name: Catalog
    description: Public storefront pages
  - name: Account
    description: Customer registration, login and profile
  - name: Admin
    description: Admin panel — requires admin login first

# ─────────────────────────────────────────────
# SECURITY SCHEMES
# ─────────────────────────────────────────────
security: []   # No global security — applied per-operation

paths:

  # ── HOME ─────────────────────────────────────
  /home:
    get:
      tags: [Catalog]
      summary: Home page
      operationId: getHomePage
      servers:
        - url: http://opencart.local:8080/index.php?route=common
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: HTML home page with category navigation menu

  # ── PRODUCT CATEGORY ─────────────────────────
  /product/category:
    get:
      tags: [Catalog]
      summary: Category product listing
      operationId: getCategoryPage
      servers:
        - url: http://opencart.local:8080/index.php?route=product
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: path
          in: query
          required: true
          description: Category ID (e.g. `20`) or subcategory path (e.g. `20_27`)
          schema:
            type: string
            example: '20'
      responses:
        '200':
          description: HTML category page listing products

  # ── PRODUCT DETAIL ────────────────────────────
  /product/product:
    get:
      tags: [Catalog]
      summary: Product detail page
      operationId: getProductPage
      servers:
        - url: http://opencart.local:8080/index.php?route=product
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
            example: 40
      responses:
        '200':
          description: HTML product detail page

  # ── SEARCH ───────────────────────────────────
  /product/search:
    get:
      tags: [Catalog]
      summary: Product search
      operationId: searchProducts
      servers:
        - url: http://opencart.local:8080/index.php?route=product
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: search
          in: query
          required: true
          schema:
            type: string
            example: MacBook
      responses:
        '200':
          description: HTML search results page

  # ── REGISTER PAGE ─────────────────────────────
  /account/register:
    get:
      tags: [Account]
      summary: Get register page — extracts register_token from response HTML
      operationId: getRegisterPage
      servers:
        - url: http://opencart.local:8080/index.php?route=account
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: HTML registration form. Scrape `register_token` from the form action URL.

  # ── REGISTER SAVE ─────────────────────────────
  /account/register.save:
    post:
      tags: [Account]
      summary: Submit registration — returns JSON redirect on success
      operationId: registerAccount
      servers:
        - url: http://opencart.local:8080/index.php?route=account
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: register_token
          in: query
          required: true
          description: CSRF token scraped from GET register page form action
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: JSON response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RedirectResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  value:
                    redirect: "http://opencart.local:8080/index.php?route=account/success&language=en-gb"
                already_exists:
                  value:
                    error:
                      warning: "Warning: E-Mail Address is already registered!"

  # ── LOGIN PAGE ────────────────────────────────
  /account/login:
    get:
      tags: [Account]
      summary: Get login page — extracts login_token from response HTML
      operationId: getLoginPage
      servers:
        - url: http://opencart.local:8080/index.php?route=account
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: HTML login form. Scrape `login_token` from the form action URL.

  # ── LOGIN SUBMIT ──────────────────────────────
  /account/login.login:
    post:
      tags: [Account]
      summary: Submit login — returns JSON with customer_token in redirect URL
      operationId: loginAccount
      servers:
        - url: http://opencart.local:8080/index.php?route=account
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: login_token
          in: query
          required: true
          description: CSRF token scraped from GET login page form action
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            JSON response.
            On success the `redirect` URL contains `customer_token=<value>` — save this for protected requests.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginSuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  value:
                    redirect: "http://opencart.local:8080/index.php?route=account/account&language=en-gb&customer_token=abc123"
                    customer:
                      customer_id: 1
                      firstname: Test
                      lastname: User
                      email: user01@testmail.com
                wrong_credentials:
                  value:
                    error:
                      warning: "Warning: No match for E-Mail Address and/or Password."

  # ── ACCOUNT PAGE ─────────────────────────────
  /account/account:
    get:
      tags: [Account]
      summary: My Account dashboard — requires customer_token
      operationId: getAccountPage
      security:
        - customerToken: []
      servers:
        - url: http://opencart.local:8080/index.php?route=account
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: HTML account dashboard. Contains "Edit your account information" when authenticated.
        '302':
          description: Redirects to login page when customer_token is missing or invalid.

  # ── LOGOUT ────────────────────────────────────
  /account/logout:
    get:
      tags: [Account]
      summary: Logout — invalidates the current customer session
      operationId: logoutAccount
      servers:
        - url: http://opencart.local:8080/index.php?route=account
          description: Catalog entry point
      parameters:
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: HTML logout confirmation page.

  # ── ADMIN LOGIN PAGE ──────────────────────────
  /admin:
    get:
      tags: [Admin]
      summary: Get admin login page — extracts admin login_token from response HTML
      operationId: getAdminLoginPage
      servers:
        - url: http://opencart.local:8080
          description: Admin entry point
      responses:
        '200':
          description: HTML admin login form. Scrape `login_token` from the form action URL.

  # ── ADMIN LOGIN SUBMIT ────────────────────────
  /common/login.login:
    post:
      tags: [Admin]
      summary: Submit admin login — returns JSON with user_token in redirect URL
      operationId: loginAdmin
      servers:
        - url: http://opencart.local:8080/admin/index.php?route=common
          description: Admin entry point
      parameters:
        - name: login_token
          in: query
          required: true
          description: CSRF token scraped from GET admin login page form action
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: |
            JSON response.
            On success the `redirect` URL contains `user_token=<value>` — save this for all admin requests.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RedirectResponse'
                  - $ref: '#/components/schemas/AdminErrorResponse'
              examples:
                success:
                  value:
                    redirect: "http://opencart.local:8080/admin/index.php?route=common/dashboard&user_token=xyz789"
                wrong_credentials:
                  value:
                    error: "Warning: No match for Username and/or Password."

  # ── ADMIN PRODUCT LIST ────────────────────────
  /catalog/product.list:
    get:
      tags: [Admin]
      summary: List products
      operationId: adminGetProductList
      security:
        - userToken: []
      servers:
        - url: http://opencart.local:8080/admin/index.php?route=catalog
          description: Admin entry point
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: filter_name
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: JSON list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  # ── ADMIN CUSTOMER LIST ───────────────────────
  /customer/customer.list:
    get:
      tags: [Admin]
      summary: List customers
      operationId: adminGetCustomerList
      security:
        - userToken: []
      servers:
        - url: http://opencart.local:8080/admin/index.php?route=customer
          description: Admin entry point
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: filter_name
          in: query
          schema:
            type: string
        - name: filter_email
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: HTML customer list page

  # ── ADMIN DELETE CUSTOMER ─────────────────────
  /customer/customer.delete:
    post:
      tags: [Admin]
      summary: Delete one or more customers
      operationId: adminDeleteCustomer
      security:
        - userToken: []
      servers:
        - url: http://opencart.local:8080/admin/index.php?route=customer
          description: Admin entry point
      parameters:
        - $ref: '#/components/parameters/Language'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: ["selected[]"]
              properties:
                "selected[]":
                  type: array
                  items:
                    type: integer
                  description: Array of customer_id values to delete
                  example: [1, 2, 3]
      responses:
        '200':
          description: JSON confirmation of deletion

# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:

  securitySchemes:
    customerToken:
      type: apiKey
      in: query
      name: customer_token
      description: |
        Obtained from the `redirect` URL in the POST `account/login.login` response.
        Example redirect: `...?route=account/account&customer_token=abc123`
    userToken:
      type: apiKey
      in: query
      name: user_token
      description: |
        Obtained from the `redirect` URL in the POST `common/login.login` response.
        Example redirect: `...?route=common/dashboard&user_token=xyz789`

  parameters:
    Language:
      name: language
      in: query
      required: false
      schema:
        type: string
        default: en-gb
        example: en-gb

  schemas:

    RegisterRequest:
      type: object
      required: [firstname, lastname, email, password, agree]
      properties:
        customer_group_id:
          type: integer
          default: 1
        firstname:
          type: string
          example: Test
        lastname:
          type: string
          example: User
        email:
          type: string
          format: email
          example: user01@testmail.com
        telephone:
          type: string
          example: '0712345678'
        password:
          type: string
          format: password
          example: Test@1234
        agree:
          type: integer
          enum: [1]
          description: Must be 1 (agree to terms and conditions)

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user01@testmail.com
        password:
          type: string
          format: password
          example: Test@1234

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: admin

    RedirectResponse:
      type: object
      properties:
        redirect:
          type: string
          description: Absolute URL to navigate to after success

    LoginSuccessResponse:
      type: object
      properties:
        redirect:
          type: string
          example: "http://opencart.local:8080/index.php?route=account/account&language=en-gb&customer_token=abc123"
        customer:
          type: object
          properties:
            customer_id:
              type: integer
            customer_group_id:
              type: integer
            firstname:
              type: string
            lastname:
              type: string
            email:
              type: string
            telephone:
              type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            warning:
              type: string
            email:
              type: string
            password:
              type: string
            firstname:
              type: string
            lastname:
              type: string
            telephone:
              type: string

    AdminErrorResponse:
      type: object
      properties:
        error:
          type: string

    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              name:
                type: string
              model:
                type: string
              price:
                type: string
              quantity:
                type: integer
              status:
                type: integer
        total:
          type: integer

